---
- name: Converge
  hosts: all
  #become: true

  vars:
    # Avoid /swapfile: /proc/swaps isn't namespaced, so mkswap inside the
    # container sees the CI runner's own /swapfile and refuses to touch it.
    swap_file_path: /swapfile-molecule
    swap_file_size_mb: '256'
    swap_test_mode: true

  pre_tasks:
    - name: Update apt cache.
      apt: update_cache=true cache_valid_time=600
      when: ansible_facts.os_family == 'Debian'

  roles:
    - role: geerlingguy.swap
